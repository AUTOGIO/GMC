<div class="kpi-grid">
  <article class="kpi-card">
    <span class="kpi-label">NAV</span>
    <strong class="kpi-value">${{ kpis.total_current|floatformat:2 }}</strong>
  </article>
  <article class="kpi-card">
    <span class="kpi-label">TARGET</span>
    <strong class="kpi-value">${{ kpis.total_target|floatformat:2 }}</strong>
  </article>
  <article class="kpi-card">
    <span class="kpi-label">DRIFT</span>
    <strong class="kpi-value {% if kpis.drift_pct > 0 %}tone-warn{% elif kpis.drift_pct < 0 %}tone-alert{% else %}tone-ok{% endif %}">
      {{ kpis.drift_pct|floatformat:2 }}%
    </strong>
  </article>
  <article class="kpi-card">
    <span class="kpi-label">ACTIVE</span>
    <strong class="kpi-value">{{ kpis.active_positions }}</strong>
  </article>
  <article class="kpi-card">
    <span class="kpi-label">WATCH</span>
    <strong class="kpi-value tone-alert">{{ kpis.watch_positions }}</strong>
  </article>
</div>
