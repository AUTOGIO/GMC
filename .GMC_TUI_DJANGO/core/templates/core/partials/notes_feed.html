<ul class="notes-feed">
  {% for note in recent_notes %}
    <li>
      <div class="note-head">
        <strong>{{ note.title }}</strong>
        <span class="dim">{{ note.created_at|date:"Y-m-d H:i" }}</span>
      </div>
      <p>{{ note.body }}</p>
    </li>
  {% empty %}
    <li class="dim">No notes available.</li>
  {% endfor %}
</ul>
